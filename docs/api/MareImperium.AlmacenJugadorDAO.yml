    startLine: 33
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Persiste el inventario completo del jugador de forma atómica: primero elimina

    todas las filas existentes con <xref href="AlmacenJugadorDAO.LimpiarAlmacen" data-throw-if-not-resolved="false"></xref> y luego inserta

    solo las entradas con cantidad mayor que cero.
  example: []
  syntax:
    content: public void GuardarAlmacen(Dictionary<int, int> almacenPorIdBien)
    parameters:
    - id: almacenPorIdBien
      type: System.Collections.Generic.Dictionary{System.Int32,System.Int32}
      description: >-
        Diccionario donde la clave es el <code>id_bien</code> y el valor es la cantidad

        de unidades que el jugador posee de ese bien.
    content.vb: Public Sub GuardarAlmacen(almacenPorIdBien As Dictionary(Of Integer, Integer))
  overload: MareImperium.AlmacenJugadorDAO.GuardarAlmacen*
