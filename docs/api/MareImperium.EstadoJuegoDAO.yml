    startLine: 64
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Escribe (o sobreescribe) el estado global de la partida en estadoJuego.

    Usa INSERT OR REPLACE para garantizar que solo existe la fila con id_estado = 1.

    La fecha de guardado se toma automáticamente como DateTime.UtcNow.
  example: []
  syntax:
    content: public void Guardar(int diaJuego, int mesJuego, int añoJuego, int velocidadTiempo, long dineroJugador = 999999999, bool modoPirata = false)
    parameters:
    - id: diaJuego
      type: System.Int32
      description: Día del calendario del juego.
    - id: mesJuego
      type: System.Int32
      description: Mes del calendario del juego.
    - id: añoJuego
      type: System.Int32
      description: Año del calendario del juego.
    - id: velocidadTiempo
      type: System.Int32
      description: Multiplicador de velocidad del tiempo activo.
    - id: dineroJugador
      type: System.Int64
      description: Monedas de oro del jugador en el momento del guardado.
    - id: modoPirata
      type: System.Boolean
      description: Si el jugador estaba actuando como pirata al guardar.
    content.vb: Public Sub Guardar(diaJuego As Integer, mesJuego As Integer, añoJuego As Integer, velocidadTiempo As Integer, dineroJugador As Long = 999999999, modoPirata As Boolean = False)
