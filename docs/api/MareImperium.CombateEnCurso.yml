    startLine: 10
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Representa un combate naval en curso resuelto de forma asíncrona, turno a turno.

    Puro C# — no hereda de MonoBehaviour. Cada turno equivale a una hora de juego.

    <xref href="GestorCombatesActivos" data-throw-if-not-resolved="false"></xref> lo crea y lo avanza cada <xref href="SimulacionTiempo.OnNuevaHora" data-throw-if-not-resolved="false"></xref>.

    El daño se distribuye sobre los barcos individuales de <xref href="FlotaRuntimeData.BarcosFlota" data-throw-if-not-resolved="false"></xref>;

    un barco con <code>VidaActual == 0</code> queda inutilizado (potencialmente capturable al final).
  example: []
  syntax:
