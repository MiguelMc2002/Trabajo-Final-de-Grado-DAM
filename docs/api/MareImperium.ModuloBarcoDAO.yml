  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Borra todos los módulos del barco indicado y los reinserta a partir de la lista actual.

    El identificador de cada módulo se genera como <code>idBarco * 100 + índice</code>.
  example: []
  syntax:
    content: public void GuardarModulosDeBarco(int idBarco, IReadOnlyList<ModuloBarcoData> modulos)
    parameters:
    - id: idBarco
      type: System.Int32
      description: Identificador del barco cuyos módulos se persisten.
    - id: modulos
      type: System.Collections.Generic.IReadOnlyList{ModuloBarcoData}
      description: Lista de <xref href="ModuloBarcoData" data-throw-if-not-resolved="false"></xref> actualmente instalados.
    content.vb: Public Sub GuardarModulosDeBarco(idBarco As Integer, modulos As IReadOnlyList(Of ModuloBarcoData))
