  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Devuelve los identificadores de todas las ciudades que tienen al menos una fila

    en la tabla EstadoMercadoCiudad. Lo usa <xref href="LoadManager" data-throw-if-not-resolved="false"></xref> para iterar

    todos los mercados guardados sin depender de ningún sistema en escena.

    Nunca devuelve <code>null</code>; devuelve lista vacía si la tabla está vacía.
  example: []
  syntax:
    content: public List<int> ObtenerIdsCiudadesConMercado()
    return:
      type: System.Collections.Generic.List{System.Int32}
      description: Lista de <code>id_ciudad</code> distintos ordenados de forma ascendente.
