    startLine: 95
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Guarda el estado completo del mercado de una ciudad iterando la lista de entradas

    procedente de <xref href="GameManager.MercadosPorCiudad" data-throw-if-not-resolved="false"></xref>. Por cada bien busca su id

    en la tabla Bien usando el nombre del <xref href="BienData" data-throw-if-not-resolved="false"></xref> asociado.

    Las entradas cuyo bien no se encuentre en la BD o no tengan <xref href="BienData" data-throw-if-not-resolved="false"></xref> asignado

    se omiten con un aviso en consola.
  example: []
  syntax:
    content: public void GuardarTodoElMercado(int idCiudad, IReadOnlyList<EntradaMercado> entradas)
    parameters:
    - id: idCiudad
      type: System.Int32
      description: Identificador de la ciudad cuyo mercado se persiste. Debe ser mayor que 0.
    - id: entradas
      type: System.Collections.Generic.IReadOnlyList{EntradaMercado}
      description: Lista de entradas del mercado obtenida del estado central de la partida.
    content.vb: Public Sub GuardarTodoElMercado(idCiudad As Integer, entradas As IReadOnlyList(Of EntradaMercado))
