  summary: >-
    Crea el brain pero NO inicia los Tasks todavía.

    Llamar a <xref href="PirataBrain.IniciarTasks" data-throw-if-not-resolved="false"></xref> después de la construcción.
  example: []
  syntax:
    content: public PirataBrain(int flotaId, float radioDeteccion, Dictionary<Vector3Int, List<Vector3Int>> grafoNavegacion, HashSet<Vector3Int> casillasCiudad)
    parameters:
    - id: flotaId
      type: System.Int32
      description: Id de la flota pirata que gobierna este brain.
    - id: radioDeteccion
      type: System.Single
      description: Radio de detección en casillas tilemap.
    - id: grafoNavegacion
      type: System.Collections.Generic.Dictionary{UnityEngine.Vector3Int,System.Collections.Generic.List{UnityEngine.Vector3Int}}
      description: >-
        Grafo pre-calculado desde el hilo principal: casilla → vecinos navegables.

        Debe ser inmutable tras la construcción.
    - id: casillasCiudad
      type: System.Collections.Generic.HashSet{UnityEngine.Vector3Int}
      description: Conjunto de casillas que corresponden a ciudades; el brain las excluye como destino de patrulla.
