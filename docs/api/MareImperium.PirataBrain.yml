  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Encola un array de snapshots para que <xref href="PirataBrain.BucleDeteccion(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> lo procese.

    Si la cola acumula más de 3 entradas, descarta la más antigua para evitar lag.

    Seguro para llamar desde cualquier hilo.
  example: []
  syntax:
    content: public void EnviarSnapshot(FlotaSnapshot[] snapshots)
    parameters:
    - id: snapshots
      type: MareImperium.FlotaSnapshot[]
      description: Array de snapshots del estado actual de todas las flotas.
