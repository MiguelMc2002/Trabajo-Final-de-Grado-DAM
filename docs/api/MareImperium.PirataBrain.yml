  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Cerebro asíncrono de una flota pirata. Ejecuta dos <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> en background:


    <ul><li><b>BucleDeteccion</b>: consume snapshots de posiciones del mundo y decide si interceptar o patrullar.</li><li><b>BucleNavegacion</b>: calcula rutas A* puras sin tocar la API de Unity.</li></ul>


    El hilo principal solo envía snapshots y consume <xref href="PirataBrain.ColaSalida" data-throw-if-not-resolved="false"></xref> — nunca bloquea.
