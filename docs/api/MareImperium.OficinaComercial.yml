  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Intermediario exclusivo entre la interfaz del mercado y los sistemas de economía

    (<xref href="GameManager" data-throw-if-not-resolved="false"></xref>, <xref href="MarketManager" data-throw-if-not-resolved="false"></xref>).

    Centraliza la validación de operaciones de compra y venta, y expone el resultado

    de la última operación mediante <xref href="OficinaComercial.UltimoMensaje" data-throw-if-not-resolved="false"></xref> para que la UI lo muestre

    al jugador sin necesidad de leer directamente el estado interno del mercado.
  remarks: >-
    Debe inicializarse con <xref href="OficinaComercial.Inicializar(MarketManager)" data-throw-if-not-resolved="false"></xref> antes de llamar a

    <xref href="OficinaComercial.Comprar(BienData%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> o <xref href="OficinaComercial.Vender(BienData%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>. Si <xref href="GameManager.Instance" data-throw-if-not-resolved="false"></xref>

    es <code>null</code> al operar (p. ej. al probar la escena Mercado directamente sin pasar

    por el Menú Principal), la operación se cancela con un aviso en el log en lugar de

    lanzar una excepción.
  example: []
  syntax:
    content: 'public class OficinaComercial : MonoBehaviour'
    content.vb: Public Class OficinaComercial Inherits MonoBehaviour
