  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Transfiere unidades de un bien entre almacén ciudad y bodega barco sin pasar por el

    mercado y sin movimiento de dinero. Ajusta automáticamente la cantidad al máximo

    disponible en el origen si se pide más de lo que hay.
  example: []
  syntax:
    content: public bool Transferir(BienData bien, int cantidad, OficinaComercial.OrigenDestino origen, OficinaComercial.OrigenDestino destino)
    parameters:
    - id: bien
      type: MareImperium.BienData
      description: Bien a transferir.
    - id: cantidad
      type: System.Int32
      description: Unidades deseadas. Debe ser mayor que 0.
    - id: origen
      type: MareImperium.OficinaComercial.OrigenDestino
      description: Almacén de origen. No puede ser <xref href="OficinaComercial.OrigenDestino.Mercado" data-throw-if-not-resolved="false"></xref>.
    - id: destino
      type: MareImperium.OficinaComercial.OrigenDestino
      description: Almacén de destino. No puede ser <xref href="OficinaComercial.OrigenDestino.Mercado" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> si la transferencia se realizó (aunque fuera parcial);

        <code>false</code> si alguna validación falló (consultar <xref href="OficinaComercial.UltimoMensaje" data-throw-if-not-resolved="false"></xref>).
    content.vb: Public Function Transferir(bien As BienData, cantidad As Integer, origen As OficinaComercial.OrigenDestino, destino As OficinaComercial.OrigenDestino) As Boolean
