  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Ejecuta la venta de un bien desde la bodega del jugador al mercado de la ciudad activa.

    Comprueba que el jugador disponga de suficientes unidades en bodega antes de delegar

    la operación al <xref href="MarketManager" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public bool Vender(BienData bien, int cantidad)
    parameters:
    - id: bien
      type: MareImperium.BienData
      description: Bien que el jugador desea vender.
    - id: cantidad
      type: System.Int32
      description: Unidades a vender. Debe ser mayor que 0.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> si la venta se realizó correctamente y el tesoro se ha actualizado;

        <code>false</code> si alguna validación falló (consultar <xref href="OficinaComercial.UltimoMensaje" data-throw-if-not-resolved="false"></xref>).
    content.vb: Public Function Vender(bien As BienData, cantidad As Integer) As Boolean
