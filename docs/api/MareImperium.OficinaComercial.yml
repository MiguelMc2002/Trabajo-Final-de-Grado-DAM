    id: Comprar
    path: TFG/Assets/Scripts/Economico/OficinaComercial.cs
    startLine: 79
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Ejecuta la compra de un bien en el mercado de la ciudad activa.

    Comprueba que la ciudad disponga de stock suficiente y que el tesoro del

    jugador cubra el coste antes de delegar la operación al <xref href="MarketManager" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public bool Comprar(BienData bien, int cantidad)
    parameters:
    - id: bien
      type: MareImperium.BienData
      description: Bien que el jugador desea adquirir.
    - id: cantidad
      type: System.Int32
      description: Unidades a comprar. Debe ser mayor que 0.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> si la compra se realizó correctamente y el inventario se ha actualizado;

        <code>false</code> si alguna validación falló (consultar <xref href="OficinaComercial.UltimoMensaje" data-throw-if-not-resolved="false"></xref>).
    content.vb: Public Function Comprar(bien As BienData, cantidad As Integer) As Boolean
