  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Inserta o sobreescribe un barco completo en la tabla Barco.

    Usa INSERT OR REPLACE para que la operación sea idempotente.
  example: []
  syntax:
    content: public void InsertarBarco(int idBarco, int idTipoCasco, string nombreBarco, bool esBarcosCombate, int vidaActual, int tripulacionActual, int capacidadTripulacion, int? idFlota)
    parameters:
    - id: idBarco
      type: System.Int32
      description: Identificador único del barco.
    - id: idTipoCasco
      type: System.Int32
      description: Tipo de casco base del barco (FK a TipoCasco).
    - id: nombreBarco
      type: System.String
      description: Nombre propio del barco.
    - id: esBarcosCombate
      type: System.Boolean
      description: Si el barco participa activamente en el combate naval.
    - id: vidaActual
      type: System.Int32
      description: Puntos de vida actuales.
    - id: tripulacionActual
      type: System.Int32
      description: Tripulantes embarcados en este momento.
    - id: capacidadTripulacion
      type: System.Int32
      description: Capacidad máxima de tripulación del casco.
    - id: idFlota
      type: System.Nullable{System.Int32}
      description: Flota a la que pertenece, o <code>null</code> si no está asignado.
    content.vb: Public Sub InsertarBarco(idBarco As Integer, idTipoCasco As Integer, nombreBarco As String, esBarcosCombate As Boolean, vidaActual As Integer, tripulacionActual As Integer, capacidadTripulacion As Integer, idFlota As Integer?)
