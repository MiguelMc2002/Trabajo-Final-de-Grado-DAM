  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Actualiza el estado dinámico de un barco existente: vida, tripulación y flota asignada.

    No modifica el tipo de casco ni el nombre.
  example: []
  syntax:
    content: public void ActualizarEstadoBarco(int idBarco, int vidaActual, int tripulacionActual, int? idFlota)
    parameters:
    - id: idBarco
      type: System.Int32
      description: Identificador del barco a actualizar.
    - id: vidaActual
      type: System.Int32
      description: Nuevos puntos de vida (puede haber recibido daño en combate).
    - id: tripulacionActual
      type: System.Int32
      description: Número actual de tripulantes.
    - id: idFlota
      type: System.Nullable{System.Int32}
      description: Nueva flota asignada, o <code>null</code> si se desvincula de su flota.
    content.vb: Public Sub ActualizarEstadoBarco(idBarco As Integer, vidaActual As Integer, tripulacionActual As Integer, idFlota As Integer?)
