  namespace: MareImperium
  summary: >-
    Decorador abstracto del patrón Decorator para cascos de barco (ComponentDecorator).

    Envuelve un <xref href="TipoCascoData" data-throw-if-not-resolved="false"></xref> base y delega todas las propiedades de

    <xref href="IBarco" data-throw-if-not-resolved="false"></xref> en él por defecto. Las subclases concretas sobreescriben con

    <code>override</code> las propiedades que necesiten modificar.

    No tiene <xref href="UnityEngine.CreateAssetMenuAttribute" data-throw-if-not-resolved="false"></xref> porque es abstracto y no se puede

    instanciar directamente desde el Editor.
  example: []
  syntax:
    content: 'public abstract class CascoDecorador : ScriptableObject, IBarco'
