    id: ComoFlotaRuntime
    path: TFG/Assets/Scripts/Astillero/FlotaJugador.cs
    startLine: 186
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Convierte la flota del jugador en un <xref href="FlotaRuntimeData" data-throw-if-not-resolved="false"></xref> para que

    <xref href="CombateNavalResolver" data-throw-if-not-resolved="false"></xref> pueda procesarla igual que cualquier otra flota.

    Usa id=-1 y nombre="Jugador".

    Nota: FuerzaCanhones y VelocidadFlota no tienen setter público en FlotaRuntimeData;

    se usan los valores por defecto del constructor hasta que se añadan dichos setters.
  example: []
  syntax:
    content: public FlotaRuntimeData ComoFlotaRuntime()
    return:
      type: MareImperium.FlotaRuntimeData
      description: Instancia de <xref href="FlotaRuntimeData" data-throw-if-not-resolved="false"></xref> con los stats agregados de la flota.
    content.vb: Public Function ComoFlotaRuntime() As FlotaRuntimeData
  overload: MareImperium.FlotaJugador.ComoFlotaRuntime*
