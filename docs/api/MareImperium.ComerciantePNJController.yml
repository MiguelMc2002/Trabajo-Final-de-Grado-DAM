  summary: >-
    Avanza la lógica de comportamiento de la flota un día de juego.

    Delega en el método privado correspondiente al estado actual de la flota.

    Debe llamarse desde <xref href="FlotaManager.TickTodosLosControladores" data-throw-if-not-resolved="false"></xref> cada vez que <code>OnNuevoDia</code> se dispare.
