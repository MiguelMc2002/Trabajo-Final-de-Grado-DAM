    startLine: 343
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Inicia un viaje hacia una ciudad destino, fijando los días de tránsito y

    registrando el precio de compra de cada bien cargado.

    Debe llamarse desde fuera al asignar un destino a la flota.
  example: []
  syntax:
    content: public void IniciarViaje(int ciudadDestinoId, Dictionary<int, double> preciosCompra, int diasViaje = 3)
    parameters:
    - id: ciudadDestinoId
      type: System.Int32
      description: Identificador de la ciudad a la que viajará la flota.
    - id: preciosCompra
      type: System.Collections.Generic.Dictionary{System.Int32,System.Double}
      description: Precios pagados por cada bien cargado (idBien → precio).
    - id: diasViaje
      type: System.Int32
      description: Duración del trayecto en días de juego (por defecto 3).
    content.vb: Public Sub IniciarViaje(ciudadDestinoId As Integer, preciosCompra As Dictionary(Of Integer, Double), diasViaje As Integer = 3)
