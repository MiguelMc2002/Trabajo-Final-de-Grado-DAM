  namespace: MareImperium
  summary: >-
    Controlador puro (no MonoBehaviour) que gobierna el ciclo de vida

    de una flota PNJ comerciante mediante una máquina de estados.

    Se instancia por cada flota registrada en <xref href="FlotaManager" data-throw-if-not-resolved="false"></xref>

    y avanza un paso por día de juego al invocar <xref href="ComerciantePNJController.Tick" data-throw-if-not-resolved="false"></xref>.
