  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Devuelve toda la memoria comercial registrada para una flota, sin filtrar

    por antigüedad. Incluye la ciudad donde se observó cada precio.

    Útil para inspeccionar o serializar el estado completo de un PNJ comerciante,

    y para obtener el snapshot global usando <code>idFlota = 0</code>.
  example: []
  syntax:
    content: public List<MemoriaComercialPNJDto> ObtenerMemoriaDeFlota(int idFlota)
    parameters:
    - id: idFlota
      type: System.Int32
      description: Identificador de la flota a consultar. Usar 0 para el snapshot global.
    return:
      type: System.Collections.Generic.List{MemoriaComercialPNJDto}
      description: >-
        Lista de <xref href="MemoriaComercialPNJDto" data-throw-if-not-resolved="false"></xref> con un registro por combinación bien-ciudad conocida.

        Vacía si la flota no tiene memoria guardada o si ocurre un error.
    content.vb: Public Function ObtenerMemoriaDeFlota(idFlota As Integer) As List(Of MemoriaComercialPNJDto)
  overload: MareImperium.MemoriaComercialPNJDAO.ObtenerMemoriaDeFlota*
