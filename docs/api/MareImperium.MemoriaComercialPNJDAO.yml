    id: ObtenerPrecioConocido
    path: TFG/Assets/Scripts/Database/MemoriaComercialPNJDAO.cs
    startLine: 158
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Consulta el precio que una flota PNJ recuerda para un bien concreto,

    aplicando la regla de los 7 días: si han transcurrido 7 o más días desde

    que se anotó el precio, se considera información obsoleta y se devuelve

    <code>null</code>. Así los PNJ comerciantes actúan con datos de mercado retrasados,

    igual que ocurría en la Liga Hanseática real.
  example: []
  syntax:
    content: public double? ObtenerPrecioConocido(int idFlota, int idBien, int diaActual)
    parameters:
    - id: idFlota
      type: System.Int32
      description: Identificador de la flota que consulta su memoria.
    - id: idBien
      type: System.Int32
      description: Identificador del bien cuyo precio se busca.
    - id: diaActual
      type: System.Int32
      description: Día de juego actual para calcular la antigüedad del dato.
    return:
      type: System.Nullable{System.Double}
      description: >-
        El precio memorizado si existe y tiene menos de 7 días de antigüedad;

        <code>null</code> si no existe registro o si el dato ha caducado.
    content.vb: Public Function ObtenerPrecioConocido(idFlota As Integer, idBien As Integer, diaActual As Integer) As Double?
  overload: MareImperium.MemoriaComercialPNJDAO.ObtenerPrecioConocido*
