  namespace: MareImperium
  summary: >-
    Registra o actualiza el precio que una flota PNJ ha observado para un bien en una ciudad concreta.

    Si ya existía un registro previo para la misma combinación de flota, bien y ciudad, se sobreescribe.
  example: []
  syntax:
    content: public void GuardarMemoria(int idFlota, int idBien, int idCiudad, double precioConocido, int diaJuegoActual)
    parameters:
    - id: idFlota
      type: System.Int32
      description: Identificador de la flota que anota el precio. Usar 0 para el snapshot global.
    - id: idBien
      type: System.Int32
      description: Índice del bien en el catálogo de <xref href="GameManager.CatalogoBienes" data-throw-if-not-resolved="false"></xref>.
    - id: idCiudad
      type: System.Int32
      description: Identificador de la ciudad donde se observó el precio.
    - id: precioConocido
      type: System.Double
      description: Precio de mercado observado en la visita.
    - id: diaJuegoActual
      type: System.Int32
      description: Día de juego actual en el momento de la observación.
