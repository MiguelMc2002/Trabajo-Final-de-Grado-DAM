  summary: >-
    Estado vivo de los mercados de todas las ciudades de la Liga Hanseática.

    La clave es el <code>IdCiudad</code> del <xref href="CiudadData" data-throw-if-not-resolved="false"></xref> correspondiente.

    Esta es la fuente de verdad del mercado: <xref href="MarketManager" data-throw-if-not-resolved="false"></xref> lee y

    escribe aquí en lugar de mantener su propia lista interna.
