  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Avanza la lógica de comportamiento pirata un día de juego.

    La lógica de detección y navegación la gestionan los <xref href="PirataBrain" data-throw-if-not-resolved="false"></xref> Tasks.

    Tick solo gestiona <xref href="PirataPNJController.TickHuyendo" data-throw-if-not-resolved="false"></xref> para el estado de huida post-combate.
