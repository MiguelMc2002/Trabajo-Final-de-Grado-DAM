    - id: flota
      type: MareImperium.FlotaRuntimeData
      description: Datos de runtime de la flota pirata que este controlador gobierna.
    - id: manager
      type: MareImperium.FlotaManager
      description: Gestor central de flotas, usado para aplicar transiciones de estado.
    - id: rutaCalculador
      type: MareImperium.RutaCalculadorTilemap
      description: Calculador de rutas A* del tilemap. Puede ser <code>null</code> si la escena Mapamundi no está cargada.
