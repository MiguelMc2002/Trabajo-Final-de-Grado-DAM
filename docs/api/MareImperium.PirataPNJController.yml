  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Controlador puro (no MonoBehaviour) que gobierna el comportamiento de una flota pirata

    mediante una máquina de estados. Se instancia desde <xref href="FlotaManager.RegistrarFlota(FlotaRuntimeData)" data-throw-if-not-resolved="false"></xref>

    cuando la flota tiene <xref href="FlotaRuntimeData.IsPirata" data-throw-if-not-resolved="false"></xref> == <code>true</code>.

    La detección de presas y el cálculo de rutas se delegan al <xref href="PirataBrain" data-throw-if-not-resolved="false"></xref> asíncrono.

    Avanza un paso por día de juego al invocar <xref href="PirataPNJController.Tick" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
