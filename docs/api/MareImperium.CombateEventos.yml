    id: DispararFinCombate
    path: TFG/Assets/Scripts/Combate/CombateEventos.cs
    startLine: 57
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Notifica que el combate del jugador ha concluido. Restablece <xref href="CombateEventos.CombateJugadorEnCurso" data-throw-if-not-resolved="false"></xref>

    y lanza <xref href="CombateEventos.OnCombateTerminado" data-throw-if-not-resolved="false"></xref> para que los sistemas pendientes (p. ej. respawn de PNJ)

    puedan ejecutarse con seguridad.

    Llamar desde <xref href="EncuentroNavalUI" data-throw-if-not-resolved="false"></xref> al cerrar el panel de resultado.
  example: []
  syntax:
    content: public static void DispararFinCombate()
    content.vb: Public Shared Sub DispararFinCombate()
  overload: MareImperium.CombateEventos.DispararFinCombate*
