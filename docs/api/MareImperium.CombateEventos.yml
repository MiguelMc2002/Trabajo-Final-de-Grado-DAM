  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: Lanza <xref href="CombateEventos.OnCombateIniciado" data-throw-if-not-resolved="false"></xref> si ambas flotas son válidas y no están destruidas.
  example: []
  syntax:
    content: public static void DispararCombate(FlotaRuntimeData atacante, FlotaRuntimeData defensor)
    parameters:
    - id: atacante
      type: MareImperium.FlotaRuntimeData
      description: Flota que inicia el ataque (no puede ser <code>null</code> ni estar destruida).
    - id: defensor
      type: MareImperium.FlotaRuntimeData
      description: Flota que recibe el ataque (no puede ser <code>null</code> ni estar destruida).
