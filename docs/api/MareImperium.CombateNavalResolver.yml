    path: TFG/Assets/Scripts/Combate/CombateNavalResolver.cs
    startLine: 26
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Resuelve un encuentro naval entre dos flotas y devuelve el resultado completo.

    Aplica el daño directamente sobre las flotas y, si el jugador gana, llama a

    <xref href="GameManager.ModificarDinero(System.Int64)" data-throw-if-not-resolved="false"></xref> con el botín de oro.
  example: []
  syntax:
    content: public static ResultadoCombate Resolver(FlotaRuntimeData atacante, FlotaRuntimeData defensor, bool jugadorEsAtacante, bool jugadorIntentaHuir = false)
    parameters:
    - id: atacante
      type: MareImperium.FlotaRuntimeData
      description: Flota que inicia el ataque.
    - id: defensor
      type: MareImperium.FlotaRuntimeData
      description: Flota que recibe el ataque.
    - id: jugadorEsAtacante
      type: System.Boolean
      description: <code>true</code> si la flota del jugador es la atacante; <code>false</code> si es la defensora.
    - id: jugadorIntentaHuir
      type: System.Boolean
      description: >-
        <code>true</code> si el jugador intenta escapar antes del combate.

        Hay un 30 % de probabilidad de huida limpia; si falla, el jugador combate

        con un 20 % de penalización en su FuerzaTotal.
    return:
      type: MareImperium.ResultadoCombate
      description: Resultado inmutable con todas las cifras del combate.
    content.vb: Public Shared Function Resolver(atacante As FlotaRuntimeData, defensor As FlotaRuntimeData, jugadorEsAtacante As Boolean, jugadorIntentaHuir As Boolean = False) As ResultadoCombate
