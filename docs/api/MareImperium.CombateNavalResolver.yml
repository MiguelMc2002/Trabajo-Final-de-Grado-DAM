  summary: >-
    Clase estática pura que resuelve encuentros navales de forma instantánea.

    No modifica ningún objeto externo salvo aplicar daño mediante <xref href="FlotaRuntimeData.AplicarDanio(System.Single)" data-throw-if-not-resolved="false"></xref>

    y transferir el botín de oro a <xref href="GameManager" data-throw-if-not-resolved="false"></xref> cuando el jugador gana.
