  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Devuelve la carga completa de un barco con el nombre de cada bien,

    obtenido mediante JOIN con la tabla Bien.
  example: []
  syntax:
    content: public List<CargaBarcoDto> ObtenerCargaDeBarco(int idBarco)
    parameters:
    - id: idBarco
      type: System.Int32
      description: Identificador del barco a consultar.
    return:
      type: System.Collections.Generic.List{CargaBarcoDto}
      description: >-
        Lista de <xref href="CargaBarcoDto" data-throw-if-not-resolved="false"></xref> con una entrada por bien embarcado.

        Vacía si el barco no lleva mercancía o si ocurre un error.
