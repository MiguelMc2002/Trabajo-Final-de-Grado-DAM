    startLine: 108
  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Persiste la bodega completa de un barco de forma atómica: primero elimina la

    carga anterior con <xref href="CargaBarcoDAO.EliminarCargaDeBarco(System.Int32)" data-throw-if-not-resolved="false"></xref> y luego inserta cada

    entrada del diccionario con <xref href="CargaBarcoDAO.GuardarCarga(System.Int32%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.

    Solo se insertan las entradas con cantidad mayor que cero.
  example: []
  syntax:
    content: public void GuardarCargaCompleta(int idBarco, Dictionary<int, int> cargaPorIdBien)
    parameters:
    - id: idBarco
      type: System.Int32
      description: Identificador del barco cuya bodega se persiste.
    - id: cargaPorIdBien
      type: System.Collections.Generic.Dictionary{System.Int32,System.Int32}
      description: >-
        Diccionario donde la clave es el <code>idBien</code> y el valor es la cantidad

        de unidades que el barco lleva de ese bien.
    content.vb: Public Sub GuardarCargaCompleta(idBarco As Integer, cargaPorIdBien As Dictionary(Of Integer, Integer))
