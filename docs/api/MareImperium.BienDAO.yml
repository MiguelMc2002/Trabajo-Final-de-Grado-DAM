  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Inserta un bien en la tabla Bien. Usa INSERT OR IGNORE para que la

    operación sea idempotente: si el bien ya existe no lanza error.
  example: []
  syntax:
    content: public void InsertarBien(int idBien, string nombre, string categoria, decimal precioBase)
    parameters:
    - id: idBien
      type: System.Int32
      description: Identificador fijo del bien.
    - id: nombre
      type: System.String
      description: Nombre del bien.
    - id: categoria
      type: System.String
      description: "Categoría: 'primario', 'intermedio' o 'avanzado'."
    - id: precioBase
      type: System.Decimal
      description: Precio base usado en la fórmula de precios reactivos.
