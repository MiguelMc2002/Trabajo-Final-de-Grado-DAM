  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Inserta o sobreescribe una flota completa en la tabla Flota.

    Usa INSERT OR REPLACE para que la operación sea idempotente.

    Los parámetros nullable se insertan como NULL en la BD cuando son <code>null</code>.
  example: []
  syntax:
    content: public void InsertarFlota(int idFlota, string tipoPropietario, int? idCiudadActual, float posX, float posY, int? idCapitan, string estadoActual, int? idCiudadDestino, float posActualX = 0, float posActualY = 0, int casillaDestinoX = 0, int casillaDestinoY = 0)
    parameters:
    - id: idFlota
      type: System.Int32
      description: Identificador único de la flota.
    - id: tipoPropietario
      type: System.String
      description: "Tipo de propietario: 'jugador', 'comerciante', 'pirata' o 'neutral'."
    - id: idCiudadActual
      type: System.Nullable{System.Int32}
      description: Ciudad en la que está atracada, o <code>null</code> si navega en mar abierto.
    - id: posX
      type: System.Single
      description: Coordenada X en el mapamundi.
    - id: posY
      type: System.Single
      description: Coordenada Y en el mapamundi.
    - id: idCapitan
      type: System.Nullable{System.Int32}
      description: Identificador del capitán asignado, o <code>null</code> si no tiene.
    - id: estadoActual
      type: System.String
      description: Estado de movimiento actual de la flota.
    - id: idCiudadDestino
      type: System.Nullable{System.Int32}
      description: Ciudad de destino si está navegando, o <code>null</code> si no tiene destino activo.
    - id: posActualX
      type: System.Single
    - id: posActualY
      type: System.Single
    - id: casillaDestinoX
      type: System.Int32
    - id: casillaDestinoY
      type: System.Int32
    content.vb: Public Sub InsertarFlota(idFlota As Integer, tipoPropietario As String, idCiudadActual As Integer?, posX As Single, posY As Single, idCapitan As Integer?, estadoActual As String, idCiudadDestino As Integer?, posActualX As Single = 0, posActualY As Single = 0, casillaDestinoX As Integer = 0, casillaDestinoY As Integer = 0)
