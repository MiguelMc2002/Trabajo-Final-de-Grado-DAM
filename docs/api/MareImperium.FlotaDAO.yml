  assemblies:
  - MareImperium.Docs
  namespace: MareImperium
  summary: >-
    Actualiza la posición y el estado de movimiento de una flota existente.

    Solo modifica los campos de navegación; no toca <code>tipo_propietario</code>

    ni <code>id_capitan</code>.
  example: []
  syntax:
    content: public void ActualizarPosicionFlota(int idFlota, float posX, float posY, string estadoActual, int? idCiudadActual, int? idCiudadDestino)
    parameters:
    - id: idFlota
      type: System.Int32
      description: Identificador de la flota a actualizar.
    - id: posX
      type: System.Single
      description: Nueva coordenada X en el mapamundi.
    - id: posY
      type: System.Single
      description: Nueva coordenada Y en el mapamundi.
    - id: estadoActual
      type: System.String
      description: Nuevo estado de movimiento.
    - id: idCiudadActual
      type: System.Nullable{System.Int32}
      description: Ciudad en la que está atracada, o <code>null</code> si está en ruta.
    - id: idCiudadDestino
      type: System.Nullable{System.Int32}
      description: Ciudad de destino activa, o <code>null</code> si no tiene destino.
